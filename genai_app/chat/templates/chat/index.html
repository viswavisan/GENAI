<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 720px; background: #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 85vh; border: 1px solid #334155; }
        header { padding: 18px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 1.25rem; font-weight: 600; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .badge { background: #0369a1; color: #e0f2fe; font-size: 0.75rem; padding: 4px 8px; border-radius: 999px; }
        #chatBox { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
        .msg.ai { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; }
        .msg.error { align-self: center; background: #7f1d1d; color: #fecaca; border: 1px solid #b91c1c; border-radius: 8px; font-size: 0.85rem; }
        .loading { display: none; align-self: flex-start; background: #334155; color: #94a3b8; font-style: italic; padding: 10px 16px; border-radius: 12px; }
        .input-area { padding: 16px 20px; border-top: 1px solid #334155; display: flex; gap: 10px; background: #1e293b; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
        input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { background: #38bdf8; color: #0f172a; font-weight: 600; border: none; padding: 12px 22px; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0284c7; color: #fff; }
        button:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Gemini AI Chat</h1>
            <span class="badge">gemini-2.5-flash</span>
        </header>
        <div id="chatBox">
            <div class="msg ai">Hello! I am powered by Google Gemini. Ask me anything to get started!</div>
            <div id="loading" class="loading">Thinking...</div>
        </div>
        <div class="input-area">
            <input id="userInput" type="text" placeholder="Ask Gemini anything..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const input = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const chatBox = document.getElementById("chatBox");
        const loading = document.getElementById("loading");

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const q = input.value.trim();
            if (!q) return;

            // Add user message
            appendMessage(q, "user");
            input.value = "";
            input.disabled = true;
            sendBtn.disabled = true;
            loading.style.display = "block";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(`/chat/api?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (res.ok && data.reply) {
                    appendMessage(data.reply, "ai");
                } else {
                    appendMessage(`⚠️ ${data.error || "Unknown error occurred"}`, "error");
                }
            } catch (err) {
                appendMessage(`⚠️ Network error: ${err.message}`, "error");
            } finally {
                loading.style.display = "none";
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function appendMessage(text, type) {
            const div = document.createElement("div");
            div.className = `msg ${type}`;
            div.textContent = text;
            chatBox.insertBefore(div, loading);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
