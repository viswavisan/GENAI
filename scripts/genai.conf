server {
    listen 80;
    server_name genaisample.duckdns.org;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name genaisample.duckdns.org;

    # SSL certificates from Let's Encrypt / Certbot
    ssl_certificate /etc/letsencrypt/live/genaisample.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genaisample.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}